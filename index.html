<script>
document.documentElement.classList.add('js');
addEventListener('DOMContentLoaded',()=>{
document.querySelectorAll('.nav .r a.n').forEach(a=>a.addEventListener('click',()=>{const n=a.closest('.nav');n.classList.remove('open');n.querySelector('.mb').setAttribute('aria-expanded','false')}));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.sec>*,.route li').forEach(el=>{if(el.getBoundingClientRect().top>innerHeight){el.classList.add('rv');io.observe(el)}});
setTimeout(()=>document.querySelectorAll('.rv').forEach(el=>el.classList.add('in')),3000);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const t=b.closest('.sec');t.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));t.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p))});
const lb=document.querySelector('.lb');if(lb){document.querySelectorAll('.show button').forEach(b=>b.onclick=()=>{lb.querySelector('img').src=b.dataset.src;lb.hidden=false});lb.onclick=()=>lb.hidden=true;addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true})}
const cap=document.querySelector('.scap');if(cap&&window.SUBJ){const S=window.SUBJ,d=cap.innerHTML;
const on=k=>{const i=S[k];document.querySelectorAll('.bk').forEach(b=>b.classList.toggle('up',b.dataset.k===k));document.querySelectorAll('.route li').forEach(l=>l.classList.toggle('hi',l.dataset.k===k));cap.style.setProperty('--c',i.c);cap.innerHTML='<b>'+i.n+'：'+(i.live?'現在可讀':'陸續上線')+'</b>'+i.st};
const off=()=>{document.querySelectorAll('.bk.up,.route li.hi').forEach(e=>e.classList.remove('up','hi'));cap.style.removeProperty('--c');cap.innerHTML=d};
document.querySelectorAll('.route a,.bk').forEach(a=>{const k=a.closest('[data-k]').dataset.k;a.addEventListener('mouseenter',()=>on(k));a.addEventListener('mouseleave',off);a.addEventListener('focus',()=>on(k));a.addEventListener('blur',off)})}
});
</script>
